# Unified slam_toolbox config for base101 (async SLAM).
# Values come from online_mapping.yaml, tuned in actual testing.
# Starts in mapping mode; the robocore bridge switches to localization
# at runtime via the /slam_toolbox/deserialize_map service — no separate
# localization config file.
# use_sim_time is injected by nav_stack.launch.py.

slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss      # robust to outliers (robot seeing itself)

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Default mode: mapping. The bridge switches to localization
    # via the /slam_toolbox/deserialize_map service when needed.
    mode: mapping

    # Performance
    transform_publish_period: 0.02      # 50Hz TF
    map_update_interval: 5.0
    resolution: 0.05                    # 5cm per pixel
    max_laser_range: 8.0                # measured: reliable range for RPLidar C1
    minimum_laser_range: 0.15           # ignore robot body reflections
    transform_timeout: 0.5
    tf_buffer_duration: 10.0

    # Scan processing
    throttle_scans: 1
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.15       # meters
    minimum_travel_heading: 0.2         # radians

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # Loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 0.4
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.6

    enable_interactive_mode: false
    debug_logging: false
