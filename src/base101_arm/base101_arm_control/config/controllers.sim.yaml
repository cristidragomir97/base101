# Sim controllers for the base101 "arm" variant (chassis wheels + one mod101
# arm). Loaded by the gz_ros2_control plugin declared in
# base101_arm_description/urdf/base101_arm.xacro; the arm gazebo launch spawns
# each controller by name once the model is up.
#
# Wheel joint/param values mirror base101_simple_control. The arm joint names
# come from the mod101_arm macro instantiated with the arm_ prefix; gripper
# joint 6 is contributed by the active tool (jaws by default).
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — must be int (Jazzy crashes on float)
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    arm_controller:
      type: position_controllers/JointGroupPositionController
    gripper_controller:
      type: position_controllers/JointGroupPositionController

    # MoveIt executes over FollowJointTrajectory, which
    # JointGroupPositionController does not offer. Same arrangement mod101 uses
    # standalone: declare both, spawn one. Each pair claims the same joints, so
    # only one of each may be active — the gazebo launch's `arm_control` arg
    # picks (sliders => the position pair, moveit => these).
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ['front_left_wheel_joint',  'back_left_wheel_joint']
    right_wheel_names: ['front_right_wheel_joint', 'back_right_wheel_joint']

    wheel_separation: 0.2899  # m — rim mid-planes of the chassis URDF (+/-0.14495 m)
    wheel_radius:     0.0363  # m — 72.6 mm DDSM210 wheel diameter / 2

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    position_feedback: true
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    publish_rate: 50.0

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    cmd_vel_timeout: 2.0

    linear.x.has_velocity_limits:     true
    linear.x.max_velocity:            0.5
    linear.x.min_velocity:           -0.5
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:        2.0

    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            1.5
    angular.z.min_velocity:           -1.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        3.0

arm_controller:
  ros__parameters:
    # The mod101 macro is instantiated with prefix "arm_" (arm.xacro), so its
    # joints are arm_<mod101 name>. These must match the ros2_control block the
    # macro emits, not the old arm_1..arm_5 naming.
    joints: [arm_joint_base, arm_joint_shoulder, arm_joint_elbow,
             arm_joint_wrist_tilt, arm_joint_wrist_roll]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

gripper_controller:
  ros__parameters:
    joints: [arm_6]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

# --- trajectory variants, for MoveIt execution --------------------------------
# Joint names are the arm_-prefixed ones the mod101_arm macro emits; the tool's
# joint is arm_6 whichever tool is fitted.
arm_trajectory_controller:
  ros__parameters:
    joints: [arm_joint_base, arm_joint_shoulder, arm_joint_elbow,
             arm_joint_wrist_tilt, arm_joint_wrist_roll]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

gripper_trajectory_controller:
  ros__parameters:
    joints: [arm_6]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true
