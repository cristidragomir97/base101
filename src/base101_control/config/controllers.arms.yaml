# Controllers for the two mod101 arms mounted on the tower's crossbeam
# brackets (arms:=true). Loaded by gz_ros2_control alongside the variant's
# controllers.<variant>.sim.yaml; spawned from gazebo.launch.py.
#
# Joint names come from the mod101_arm macro instantiated with the
# left_arm_ / right_arm_ prefixes in base101_description/urdf/base101_arms.xacro.
# Gripper joint 6 is contributed by the active tool (jaws by default — same
# joint name in the parallel/pincopen tools too).
controller_manager:
  ros__parameters:
    left_arm_controller:
      type: position_controllers/JointGroupPositionController
    right_arm_controller:
      type: position_controllers/JointGroupPositionController
    left_gripper_controller:
      type: position_controllers/JointGroupPositionController
    right_gripper_controller:
      type: position_controllers/JointGroupPositionController

left_arm_controller:
  ros__parameters:
    joints: [left_arm_1, left_arm_2, left_arm_3, left_arm_4, left_arm_5]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

right_arm_controller:
  ros__parameters:
    joints: [right_arm_1, right_arm_2, right_arm_3, right_arm_4, right_arm_5]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

left_gripper_controller:
  ros__parameters:
    joints: [left_arm_6]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

right_gripper_controller:
  ros__parameters:
    joints: [right_arm_6]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true
