# Hardware controllers config — placeholder.
# Same controller topology as sim, but use_sim_time:=false and tuned for real
# hardware. Wheel geometry numbers should be measured on the physical robot.
#
# The hardware overlay (base101.hardware.xacro) is not yet wired to a real
# motor driver — add the appropriate ros2_control SystemInterface plugin
# when the hardware bring-up plumbing exists.
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # Cross tower (lift column + pan/tilt head). Only spawned when the URDF
    # is built with tower:=true — see control_stack.launch.py.
    tower_controller:
      type: position_controllers/JointGroupPositionController

tower_controller:
  ros__parameters:
    joints: [lift, head_pan, head_tilt]

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ['wheel_front_left',  'wheel_rear_left']
    right_wheel_names: ['wheel_front_right', 'wheel_rear_right']

    # Override per variant on the hardware side.
    wheel_separation: 0.29
    wheel_radius:     0.040

    position_feedback: true
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
