# Sim controllers for the base101_pro variant.
# Loaded by the gz_ros2_control plugin (see base101_pro.gazebo).
#
# wheel_separation / wheel_radius below are estimated from the URDF visual
# origins + inertias and should be refined against the physical hardware.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — must be int (Jazzy crashes on float)
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # Cross tower (lift column + pan/tilt head). Only spawned when the URDF
    # is built with tower:=true — see gazebo.launch.py.
    tower_controller:
      type: position_controllers/JointGroupPositionController

tower_controller:
  ros__parameters:
    joints: [lift, head_pan, head_tilt]

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ['wheel_front_left',  'wheel_rear_left']
    right_wheel_names: ['wheel_front_right', 'wheel_rear_right']

    # Track width and wheel radius for the pro (DDSM115 hub motor) variant.
    wheel_separation: 0.38     # m, approx — refine from CAD
    wheel_radius:     0.05035  # m — 100.7 mm DDSM115 wheel diameter / 2

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    position_feedback: true
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    publish_rate: 50.0

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    cmd_vel_timeout: 2.0

    linear.x.has_velocity_limits:     true
    linear.x.max_velocity:            1.5
    linear.x.min_velocity:           -1.5
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:        2.5

    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            2.5
    angular.z.min_velocity:           -2.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        3.5
