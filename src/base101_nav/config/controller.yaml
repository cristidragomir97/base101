# MPPI controller for the base101 differential drive base.
#
# Adopted from TurtleBot4's nav2.yaml (which itself follows nav2_bringup
# defaults). Velocity caps raised to match base101's hardware envelope.
# Critic weights left at canonical values — they are well-tuned for
# generic diff-drive indoor navigation; only revisit if a specific
# behavior is wrong.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0          # Nav2 default
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5       # Not used for diff drive
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    use_realtime_priority: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # PoseProgressChecker catches "spinning forever in place" — SimpleProgressChecker
    # only watches translation, so a robot that keeps rotating without moving xy
    # never trips it. PoseProgressChecker tracks pose delta (xy AND yaw).
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.5      # ~28 deg
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000                    # halved from canonical 2000 — RTF win, marginal quality hit

      # Acceleration limits — kept at hw caps (controllers.simple.sim.yaml
      # gives linear 2.5, angular 3.5; bumped az for snappier rotation onset).
      ax_max: 2.5
      ax_min: -2.5
      ay_max: 2.5
      az_max: 3.5

      # Sampling noise — canonical TB4 values.
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4

      # Velocity envelope. Limits chosen for the simple variant (DDSM210,
      # 72.6 mm wheel, 210 RPM motor cap → ~0.8 m/s real maximum).
      # PRO variant can do ~1.5 m/s — bump vx_max if testing on pro.
      # wz_max matches hw cap (2.5 rad/s = ~143 deg/s) for snappy turns.
      vx_max: 0.8
      vx_min: -0.30
      vy_max: 0.0                       # diff drive, no lateral
      wz_max: 2.5

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      # Bumped weight 3.0 -> 6.0 — converges yaw faster, reduces orbiting/overshoot.
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      # CostCritic uses the local_costmap directly — no need to mirror
      # inflation params here (that was an RPP requirement).
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
