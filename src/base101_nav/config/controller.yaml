# Regulated Pure Pursuit controller for the base101 differential drive base.
# Lightweight path follower; obstacle avoidance comes from the planner +
# costmap inflation, not the controller itself.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5         # Not used for diff drive
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25             # 25 cm position tolerance
      yaw_goal_tolerance: 0.25            # ~14 deg orientation tolerance
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Velocity envelope — match velocity_smoother.yaml.
      # Hardware caps are 1.5 m/s and 2.5 rad/s; small margin kept for safety.
      desired_linear_vel: 1.2
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.6
      max_angular_accel: 2.5
      rotate_to_heading_min_angle: 0.785  # ~45 deg — turn in place before driving when goal heading is way off
      rotate_to_heading_angular_vel: 1.5

      # Lookahead — distance ahead on the path that the controller aims for.
      # Use velocity-scaled lookahead so it stretches at speed.
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0                 # seconds-of-travel ahead
      min_lookahead_dist: 0.30
      max_lookahead_dist: 1.20
      lookahead_dist: 0.6                 # used only if velocity_scaled is false

      # Curvature regulation — slow down on tight bends so the robot can track them.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.25

      # Cost regulation — slow down near obstacles in the local costmap.
      # MUST match inflation_layer.cost_scaling_factor in costmap.yaml or RPP
      # will mis-estimate proximity. Both now follow Nav2/TurtleBot4 pattern.
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.55             # match inflation_radius
      cost_scaling_gain: 1.0

      # Forward-projected collision check. With gentle inflation gradient this
      # is far less trigger-happy than before; keep it on.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # Heading control near goal.
      use_rotate_to_heading: true         # rotate in place at goal if final yaw is required
      allow_reversing: false              # diff drive can but we don't plan reversed paths

      transform_tolerance: 0.2
