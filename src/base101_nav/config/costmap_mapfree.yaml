# Costmap Configuration for base101 robot (Mapfree Mode)
# Used in mapfree mode - no static map, rolling windows only

# Global costmap - rolling window without static map
global_costmap:
  global_costmap:
    ros__parameters:
      # 3 Hz update (Nav2 default for navigation mode is 1 Hz, but in slam_nav
      # the underlying /map is GROWING — needs faster catch-up so explore's
      # first frontier scan finds clear cells near the robot).
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map                   # SLAM publishes /map and map->odom
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[0.25, 0.24], [0.25, -0.24], [-0.25, -0.24], [-0.25, 0.24]]"
      resolution: 0.05
      # Keep unknown cells distinguishable from free in the costmap output —
      # explore_lite needs to see them to identify frontiers. The planner's
      # `allow_unknown: true` (see planner.yaml) lets it cross unknown anyway,
      # so we get both: explore can find frontiers AND planner can plan to them.
      track_unknown_space: true
      rolling_window: false               # Use full SLAM map, not a rolling window
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        map_topic: /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true

# Local costmap - same as map-based mode
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0               # was 5.0 Nav2 default, lowered for RTF on this dev box
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[0.25, 0.24], [0.25, -0.24], [-0.25, -0.24], [-0.25, 0.24]]"
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true
