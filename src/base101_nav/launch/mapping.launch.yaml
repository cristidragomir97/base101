launch:

- arg:
    name: use_sim_time
    default: 'false'
    description: Use simulation time
- arg:
    name: autostart
    default: 'true'
    description: Automatically start lifecycle nodes

- node:
    pkg: slam_toolbox
    exec: async_slam_toolbox_node
    name: slam_toolbox
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/slam_toolbox.yaml
    - name: use_sim_time
      value: $(var use_sim_time)

- timer:
    period: 2.0
    children:
    - node:
        pkg: nav2_lifecycle_manager
        exec: lifecycle_manager
        name: lifecycle_manager_slam
        output: screen
        param:
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: autostart
          value: $(var autostart)
        - name: bond_timeout
          value: 20.0
        - name: node_names
          value:
          - slam_toolbox
