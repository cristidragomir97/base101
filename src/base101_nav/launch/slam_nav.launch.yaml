launch:

- arg:
    name: use_sim_time
    default: 'false'
    description: Use simulation time
- arg:
    name: autostart
    default: 'true'
    description: Automatically start lifecycle nodes
- arg:
    name: explore
    default: 'false'
    description: Enable autonomous frontier exploration

- node:
    pkg: robot_localization
    exec: ekf_node
    name: ekf_filter_node
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/ekf.sim.yaml
    - name: use_sim_time
      value: $(var use_sim_time)
    remap:
    - from: odometry/filtered
      to: /odometry/filtered

- node:
    pkg: slam_toolbox
    exec: async_slam_toolbox_node
    name: slam_toolbox
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/online_mapping.yaml
    - name: use_sim_time
      value: $(var use_sim_time)

- node:
    pkg: nav2_planner
    exec: planner_server
    name: planner_server
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/planner.yaml
    - from: $(find-pkg-share base101_nav)/config/costmap_mapfree.yaml
    - name: use_sim_time
      value: $(var use_sim_time)

- node:
    pkg: nav2_controller
    exec: controller_server
    name: controller_server
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/controller.yaml
    - from: $(find-pkg-share base101_nav)/config/costmap_mapfree.yaml
    - name: use_sim_time
      value: $(var use_sim_time)
    remap:
    - from: cmd_vel
      to: cmd_vel_raw

- node:
    pkg: nav2_bt_navigator
    exec: bt_navigator
    name: bt_navigator
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/bt_navigator.yaml
    - name: use_sim_time
      value: $(var use_sim_time)
    - name: default_nav_to_pose_bt_xml
      value: $(find-pkg-share base101_nav)/behavior_trees/nav_to_pose.xml
    - name: default_nav_through_poses_bt_xml
      value: $(find-pkg-share base101_nav)/behavior_trees/nav_through_poses.xml

- node:
    pkg: nav2_behaviors
    exec: behavior_server
    name: behavior_server
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/behavior.yaml
    - from: $(find-pkg-share base101_nav)/config/costmap_mapfree.yaml
    - name: use_sim_time
      value: $(var use_sim_time)
    remap:
    - from: cmd_vel
      to: cmd_vel_raw

- node:
    pkg: nav2_velocity_smoother
    exec: velocity_smoother
    name: velocity_smoother
    output: screen
    param:
    - from: $(find-pkg-share base101_nav)/config/velocity_smoother.yaml
    - name: use_sim_time
      value: $(var use_sim_time)
    remap:
    - from: cmd_vel
      to: cmd_vel_raw
    - from: cmd_vel_smoothed
      to: cmd_vel_nav

- timer:
    period: 10.0
    children:
    - node:
        pkg: nav2_lifecycle_manager
        exec: lifecycle_manager
        name: lifecycle_manager_slam_nav
        output: screen
        param:
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: autostart
          value: $(var autostart)
        - name: bond_timeout
          value: 30.0
        - name: node_names
          value:
          - slam_toolbox
          - planner_server
          - controller_server
          - bt_navigator
          - behavior_server
          - velocity_smoother

- timer:
    period: 20.0
    children:
    - node:
        pkg: explore_lite
        exec: explore
        name: explore_node
        output: screen
        if: $(var explore)
        param:
        - from: $(find-pkg-share base101_nav)/config/explore.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
